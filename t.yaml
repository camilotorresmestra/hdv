cv:
  name: Camilo Torres Mestra
  location: LATAM
  email: camilotorresmestra@gmail.com
  website: https://camilotorresmestra.github.io
  social_networks:
    - network: LinkedIn
      username: camilotorresmestra
    - network: GitHub
      username: camilotorresmestra

  sections:
    profile:
      - " Data Engineer with 3+ years of experience designing, building, and scaling data platforms and analytics
          solutions. Strong focus on democratizing data access, enabling operational and commercial insights,
          and delivering high-impact data products in fast-growing, regional environments. Proven background in
          logistics, operations, and real-time data systems across LATAM."

    Skills:
      - bullet: "Data Engineering: ETL/ELT, data modeling, data quality frameworks, Apache Spark, Kafka, Airflow, dbt"
      - bullet: "Analytics Engineering: Metrics definition, semantic layers, self-service BI, operational dashboards"
      - bullet: "Cloud & Platforms: GCP, AWS, Azure, Docker, Kubernetes"
      - bullet: "Databases & Warehousing: BigQuery, Snowflake, PostgreSQL, SQL Server, MongoDB"
      - bullet: "Data Governance & Access: Microsoft Purview, DataHub, metadata management, lineage"
      - bullet: "Visualization & Insights: LookerStudio, Tableau, PowerBI"
      - bullet: "Programming: Python, SQL, Java"

    Experience:
      - company: Jefferson Capital LLC
        position: Data Management Analyst
        location: Bogotá, Colombia
        start_date: 2025
        end_date: present
        summary: 
          Supporting financial and operational teams by transforming raw data into trusted, governed datasets
          and actionable insights.
        highlights:
          - "Designed and maintained ETL pipelines in Azure Synapse and SQL Server to standardize financial and operational data."
          - "Implemented Microsoft Purview to enable enterprise-wide data lineage, governance, and secure access."
          - "Delivered operational and commercial dashboards that improved decision-making speed and reduced manual analysis."

      - company: Kiwibot
        position: Data Engineer
        location: Remote
        start_date: 2023
        end_date: 2024
        summary: 
          Built scalable data products and real-time pipelines to support logistics, operations, and analytics teams
          across multiple regions.
        highlights:
          - "Developed real-time data pipelines using Kafka, Spark, and Airflow to power high-impact logistics products."
          - "Enabled self-service analytics by modeling curated datasets and improving data accessibility company-wide."
          - "Containerized and deployed data services with Docker and Kubernetes, improving reliability and scalability."

      - company: Kiwibot
        position: Data Analyst
        location: Remote
        start_date: 2022
        end_date: 2023
        summary: 
          Focused on analytics engineering and insight generation for operational and commercial stakeholders.
        highlights:
          - "Automated analytics pipelines with dbt and LookerStudio, democratizing access to operational metrics."
          - "Generated actionable insights for maintenance and service operations, reducing incidents and downtime."
          - "Collaborated closely with business teams to evolve data products aligned with strategic decisions."

    Projects:
      - name: Data Pipeline Optimization
        date: 2023
        summary: 
          Cloud migration and optimization of analytics pipelines to support scalable data products.
        highlights:
          - "Migrated pipelines to GCP and AWS using dbt with BigQuery and Snowflake."
          - "Introduced automated data quality checks to ensure trust and reliability of critical datasets."

      - name: Predictive Maintenance & Operational Insights
        date: 2022
        summary: 
          End-to-end data and ML pipeline to support operational decision-making in logistics environments.
        highlights:
          - "Built streaming pipelines with Spark and Kafka for continuous ingestion and analytics."
          - "Delivered insights that improved operational efficiency and reduced incident rates."

    Education:
      - institution: Universidad de los Andes
        area: Information Engineering
        degree: MS
        start_date: 2025
        end_date: present
        highlights:
          - "Focus on Data Engineering, Big Data, Cloud Computing, and Digital Transformation."

      - institution: Universidad Nacional de Colombia
        area: Mechatronics Engineering
        degree: BS
        end_date: 2021
        highlights:
          - "Strong foundation in data structures, statistics, and applied analytics."
design:
  theme: engineeringresumes
  page:
    size: us-letter
    top_margin: 2cm
    bottom_margin: 2cm
    left_margin: 2cm
    right_margin: 2cm
    show_page_numbering: false
    show_last_updated_date: false
  colors:
    text: rgb(0, 0, 0)
    name: rgb(0, 0, 0)
    connections: rgb(0, 0, 0)
    section_titles: rgb(0, 0, 0)
    links: rgb(0, 0, 0)
    last_updated_date_and_page_numbering: rgb(128, 128, 128)
  text:
    font_family: XCharter
    font_size: 10pt
    leading: 0.6em
    alignment: justified
    date_and_location_column_alignment: right
  links:
    underline: true
    use_external_link_icon: false
  header:
    name_font_family: XCharter
    name_font_size: 25pt
    name_bold: false
    photo_width: 3.5cm
    vertical_space_between_name_and_connections: 0.7cm
    vertical_space_between_connections_and_first_section: 0.7cm
    horizontal_space_between_connections: 0.4cm
    connections_font_family: XCharter
    separator_between_connections: '|'
    use_icons_for_connections: false
    alignment: center
  section_titles:
    type: with-full-line
    font_family: XCharter
    font_size: 1.2em
    bold: true
    small_caps: false
    line_thickness: 0.5pt
    vertical_space_above: 0.55cm
    vertical_space_below: 0.45cm
    
  entries:
    date_and_location_width: 4.15cm
    left_and_right_margin: 0cm
    horizontal_space_between_columns: 0.1cm
    vertical_space_between_entries: 0.4cm
    allow_page_break_in_sections: true
    allow_page_break_in_entries: false
    short_second_row: false
    show_time_spans_in: []
  highlights:
    bullet: •
    top_margin: 0.25cm
    left_margin: 0cm
    vertical_space_between_highlights: 0.21cm
    horizontal_space_between_bullet_and_highlight: 0.3em
    summary_left_margin: 0cm
  entry_types:
    one_line_entry:
      template: '**LABEL:** DETAILS'
    education_entry:
      main_column_first_row_template: '**INSTITUTION**, DEGREE in AREA -- LOCATION'
      degree_column_template:
      degree_column_width: 1cm
      main_column_second_row_template: |-
        SUMMARY
        HIGHLIGHTS
      date_and_location_column_template: DATE
    normal_entry:
      main_column_first_row_template: '**NAME** -- **LOCATION**'
      main_column_second_row_template: |-
        SUMMARY
        HIGHLIGHTS
      date_and_location_column_template: DATE
    experience_entry:
      main_column_first_row_template: '**POSITION**, COMPANY -- LOCATION'
      main_column_second_row_template: |-
        SUMMARY
        HIGHLIGHTS
      date_and_location_column_template: DATE
    publication_entry:
      main_column_first_row_template: '**TITLE**'
      main_column_second_row_template: |-
        AUTHORS
        URL (JOURNAL)
      main_column_second_row_without_journal_template: |-
        AUTHORS
        URL
      main_column_second_row_without_url_template: |-
        AUTHORS
        JOURNAL
      date_and_location_column_template: DATE
